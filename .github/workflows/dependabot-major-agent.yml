name: Dependabot Major-Update Agent

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Dependabot PR number to inspect and fix"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  fix-dependabot-pr:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.pull_requests[0].number != null)
    steps:
      - name: Verify PR is a same-repo Dependabot PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_PR: ${{ inputs.pr_number }}
          WORKFLOW_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          PR_NUM="${INPUT_PR:-$WORKFLOW_PR}"
          if [ -z "$PR_NUM" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PR_JSON=$(gh pr view "$PR_NUM" --repo "${{ github.repository }}" --json author,headRefName,isCrossRepository,title,state)
          AUTHOR=$(echo "$PR_JSON" | jq -r '.author.login')
          IS_CROSS=$(echo "$PR_JSON" | jq -r '.isCrossRepository')
          HEAD_REF=$(echo "$PR_JSON" | jq -r '.headRefName')
          TITLE=$(echo "$PR_JSON" | jq -r '.title')
          STATE=$(echo "$PR_JSON" | jq -r '.state')

          if [ "$STATE" != "OPEN" ] || [ "$IS_CROSS" != "false" ]; then
            echo "Skipping: PR #$PR_NUM is not an open same-repo PR."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$AUTHOR" != "app/dependabot" ] && [ "$AUTHOR" != "dependabot[bot]" ]; then
            echo "Skipping: PR #$PR_NUM author is '$AUTHOR', not Dependabot."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUM" >> "$GITHUB_OUTPUT"
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Check GEMINI_API_KEY secret
        id: key
        if: steps.pr.outputs.should_run == 'true'
        env:
          HAS_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "GEMINI_API_KEY secret is not configured; skipping."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout PR branch
        if: steps.pr.outputs.should_run == 'true' && steps.key.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        if: steps.pr.outputs.should_run == 'true' && steps.key.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        if: steps.pr.outputs.should_run == 'true' && steps.key.outputs.available == 'true'
        run: npm ci

      - name: Run Gemini CLI to inspect and fix breaking changes
        if: steps.pr.outputs.should_run == 'true' && steps.key.outputs.available == 'true'
        uses: google-github-actions/run-gemini-cli@v0.1.22
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            You are helping maintain the `strayps` repository on Dependabot PR #${{ steps.pr.outputs.pr_number }}: "${{ steps.pr.outputs.title }}".

            1. Read `AGENTS.md` and `package.json` (note that `engines.node` is `>=20.0.0`).
            2. Inspect what changed in `package.json` / `package-lock.json` (`git diff origin/main...HEAD -- package.json`).
            3. If a runtime dependency (`dependencies`, not `devDependencies`) now requires Node > 20 in its `engines.node`, do NOT edit any files — instead write a short explanation into `/tmp/agent-note.txt` explaining why this PR breaks Node 20 compatibility.
            4. Otherwise, run `npm run check` to see the exact typecheck, test, or build failures.
            5. Make minimal, clean fixes to the codebase/tests/config to resolve the breaking changes while strictly respecting all safety invariants in `AGENTS.md`, and re-run `npm run check` until it passes.
            6. Do NOT run `git commit` or `git push`. Leave your verified edits in the working tree and write a concise 2-4 line summary of what you found/changed into `/tmp/agent-note.txt`.

      - name: Verify check gate, push fix if green, and comment on PR
        if: steps.pr.outputs.should_run == 'true' && steps.key.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ steps.pr.outputs.pr_number }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        run: |
          NOTE=""
          if [ -f /tmp/agent-note.txt ]; then
            NOTE=$(cat /tmp/agent-note.txt)
          fi

          if [ -n "$(git status --porcelain)" ]; then
            if npm run check; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add -A
              git commit -m "fix: adapt codebase for Dependabot PR #$PR_NUM"
              git push origin "HEAD:$HEAD_REF"
              gh pr comment "$PR_NUM" --repo "${{ github.repository }}" --body "🤖 **Gemini Agent:** Applied fixes and verified \`npm run check\` passes.

          $NOTE

          *(Note: Pushes from \`GITHUB_TOKEN\` do not trigger CI automatically — please re-run CI or close/reopen the PR before merging.)*"
            else
              git checkout -- .
              gh pr comment "$PR_NUM" --repo "${{ github.repository }}" --body "🤖 **Gemini Agent:** Attempted a fix, but \`npm run check\` still failed. Changes were reverted; manual review needed.

          $NOTE"
            fi
          else
            gh pr comment "$PR_NUM" --repo "${{ github.repository }}" --body "🤖 **Gemini Agent:** No automated changes were applied.

          $NOTE"
          fi
