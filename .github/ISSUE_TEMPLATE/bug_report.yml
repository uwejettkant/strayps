name: Bug Report
description: Report a bug in strayps
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug!
        If this is a security vulnerability, please do **not** open a public issue — report it privately via [Security Policy](https://github.com/uwejettkant/strayps/blob/main/SECURITY.md).
        Please redact any tokens or secrets before pasting command lines or logs.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: What command or workflow triggered the issue?
      placeholder: |
        1. Run `strayps watch ...`
        2. ...
    validations:
      required: true
  - type: input
    id: strayps-version
    attributes:
      label: strayps version
      description: Output of `strayps --version`
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`
      placeholder: "v22.17.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Linux (unverified)
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output or logs
      description: Remember to remove any tokens, keys, or private paths.
      render: shell
