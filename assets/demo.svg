<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="100%" height="100%" role="img" aria-label="Animated demo of agent-leash CLI and real-time web dashboard">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
      @keyframes appear1 { 0%, 8% { opacity: 0; } 12%, 100% { opacity: 1; } }
      @keyframes appear2 { 0%, 24% { opacity: 0; } 28%, 100% { opacity: 1; } }
      @keyframes appear3 { 0%, 44% { opacity: 0; } 48%, 100% { opacity: 1; } }
      @keyframes appear4 { 0%, 64% { opacity: 0; } 68%, 100% { opacity: 1; } }
      @keyframes appear5 { 0%, 80% { opacity: 0; } 84%, 100% { opacity: 1; } }
      @keyframes pulseRed { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
      .step1 { animation: appear1 10s infinite; }
      .step2 { animation: appear2 10s infinite; }
      .step3 { animation: appear3 10s infinite; }
      .step4 { animation: appear4 10s infinite; }
      .step5 { animation: appear5 10s infinite; }
      .pulse { animation: pulseRed 1.4s infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="540" rx="16" fill="#080B09" stroke="#1F2C25" stroke-width="2" />

  <!-- LEFT PANE: CLI Terminal -->
  <g transform="translate(24, 24)">
    <rect width="560" height="492" rx="12" fill="#0D120F" stroke="#1F2C25" stroke-width="1.5" />
    <rect width="560" height="38" rx="12" fill="#0B0F0D" />
    <line x1="0" y1="38" x2="560" y2="38" stroke="#1F2C25" />
    <circle cx="20" cy="19" r="5" fill="#2A3A31" />
    <circle cx="36" cy="19" r="5" fill="#2A3A31" />
    <circle cx="52" cy="19" r="5" fill="#2A3A31" />
    <text x="72" y="23" class="mono" font-size="12" fill="#8FA197">zsh — npx agent-leash</text>

    <!-- Command -->
    <text x="20" y="70" class="mono" font-size="13" fill="#5BE49B">$</text>
    <text x="36" y="70" class="mono" font-size="13" fill="#F2F7F4">npx agent-leash</text>

    <!-- Step 1: Startup Banner -->
    <g class="step1">
      <rect x="20" y="86" width="520" height="88" rx="8" fill="#0B0F0D" stroke="#1F2C25" />
      <text x="34" y="108" class="mono" font-size="12" font-weight="600" fill="#5BE49B">agent-leash v0.1.0 — AI Agent &amp; MCP Watchdog</text>
      <text x="34" y="128" class="mono" font-size="11.5" fill="#C9D6CE">Mode:       BALANCED (warn=15, stop=40, loop=5/min)</text>
      <text x="34" y="146" class="mono" font-size="11.5" fill="#C9D6CE">Checkpoint: 8f3a91c (git-stash-commit, 42 files)</text>
      <text x="34" y="164" class="mono" font-size="11.5" fill="#5BE49B">Dashboard:  http://127.0.0.1:4321</text>
    </g>

    <!-- Step 2: Protected File Blocked -->
    <g class="step2">
      <rect x="20" y="192" width="520" height="58" rx="8" fill="#2A0A0E" stroke="#EF4444" stroke-opacity="0.5" />
      <text x="34" y="214" class="mono" font-size="12" font-weight="700" fill="#F87171">[PROTECTED] Blocked edit to .env.local</text>
      <text x="34" y="236" class="mono" font-size="11.5" fill="#FECACA">✓ Auto-reverted .env.local from checkpoint in 3ms</text>
    </g>

    <!-- Step 3: Loop / Thrashing Detected -->
    <g class="step3">
      <text x="20" y="276" class="mono" font-size="11.5" fill="#8FA197">CHANGE: src/auth/session.ts (4/5 edits/min)</text>
      <text x="20" y="294" class="mono" font-size="11.5" fill="#8FA197">CHANGE: src/auth/session.ts (5/5 edits/min)</text>
      <rect x="20" y="308" width="520" height="62" rx="8" fill="#2A0A0E" stroke="#EF4444" stroke-opacity="0.7" />
      <text x="34" y="330" class="mono" font-size="12" font-weight="700" fill="#F87171">[CIRCUIT BREAKER] Thrashing on src/auth/session.ts (6/5/min)!</text>
      <text x="34" y="352" class="mono" font-size="11.5" fill="#FECACA">✓ Rolled back src/auth/session.ts to 8f3a91c</text>
    </g>

    <!-- Step 4: Zombie MCP Process -->
    <g class="step4">
      <rect x="20" y="388" width="520" height="62" rx="8" fill="#291805" stroke="#F59E0B" stroke-opacity="0.6" />
      <text x="34" y="410" class="mono" font-size="12" font-weight="700" fill="#FBBF24">[ZOMBIE MCP] PID 48210 (mcp-server-fs) silent for 46s</text>
      <text x="34" y="432" class="mono" font-size="11.5" fill="#FDE68A">Status -> FROZEN (CPU: 0.0%, no file heartbeat)</text>
    </g>

    <!-- Step 5: Killed via Dashboard -->
    <g class="step5">
      <text x="20" y="474" class="mono" font-size="12" fill="#5BE49B">✓ Terminated frozen PID 48210 via SIGKILL — repo clean</text>
    </g>
  </g>

  <!-- RIGHT PANE: Live Web Dashboard -->
  <g transform="translate(608, 24)">
    <rect width="568" height="492" rx="12" fill="#0D120F" stroke="#1F2C25" stroke-width="1.5" />
    <rect width="568" height="38" rx="12" fill="#0B0F0D" />
    <line x1="0" y1="38" x2="568" y2="38" stroke="#1F2C25" />
    <circle cx="20" cy="19" r="5" fill="#2A3A31" />
    <circle cx="36" cy="19" r="5" fill="#2A3A31" />
    <circle cx="52" cy="19" r="5" fill="#2A3A31" />
    <text x="72" y="23" class="mono" font-size="12" fill="#8FA197">http://127.0.0.1:4321 — Live SSE Dashboard</text>
    <circle cx="468" cy="19" r="4" fill="#5BE49B" />
    <text x="480" y="23" class="mono" font-size="11" fill="#5BE49B">connected</text>

    <!-- Mode Bar & Panic Button -->
    <rect x="20" y="54" width="214" height="34" rx="6" fill="#0B0F0D" stroke="#1F2C25" />
    <text x="34" y="75" class="mono" font-size="11" fill="#8FA197">strict</text>
    <rect x="82" y="59" width="76" height="24" rx="4" fill="#5BE49B" />
    <text x="94" y="75" class="mono" font-size="11" font-weight="700" fill="#06140C">balanced</text>
    <text x="174" y="75" class="mono" font-size="11" fill="#8FA197">yolo</text>

    <rect x="336" y="54" width="212" height="34" rx="6" fill="#DC2626" />
    <circle cx="352" cy="71" r="4" fill="#FFFFFF" class="pulse" />
    <text x="364" y="75" class="mono" font-size="11" font-weight="700" fill="#FFFFFF">PANIC ROLLBACK &amp; KILL</text>

    <!-- KPI Cards -->
    <g transform="translate(20, 104)">
      <rect x="0" y="0" width="168" height="68" rx="8" fill="#0B0F0D" stroke="#1F2C25" />
      <text x="12" y="20" class="mono" font-size="10" fill="#8FA197">MODIFIED FILES</text>
      <text x="12" y="44" class="mono" font-size="20" font-weight="700" fill="#F2F7F4">2 <tspan font-size="11" font-weight="400" fill="#8FA197">/ 15 warn</tspan></text>
      <text x="12" y="60" class="mono" font-size="10" fill="#5BE49B">checkpoint: 8f3a91c</text>

      <rect x="180" y="0" width="168" height="68" rx="8" fill="#0B0F0D" stroke="#1F2C25" />
      <text x="192" y="20" class="mono" font-size="10" fill="#8FA197">CIRCUIT BREAKER</text>
      <text x="192" y="44" class="mono" font-size="18" font-weight="700" fill="#F87171" class="step3">TRIPPED (1)</text>
      <text x="192" y="60" class="mono" font-size="10" fill="#8FA197">max 5 edits/file/min</text>

      <rect x="360" y="0" width="168" height="68" rx="8" fill="#0B0F0D" stroke="#1F2C25" />
      <text x="372" y="20" class="mono" font-size="10" fill="#8FA197">MCP PROCESSES</text>
      <text x="372" y="44" class="mono" font-size="20" font-weight="700" fill="#F2F7F4">2 <tspan font-size="11" font-weight="700" fill="#F87171" class="step4">1 frozen</tspan></text>
      <text x="372" y="60" class="mono" font-size="10" fill="#8FA197">timeout: 45s silence</text>
    </g>

    <!-- Live Activity Ticker Box -->
    <rect x="20" y="188" width="528" height="162" rx="8" fill="#0B0F0D" stroke="#1F2C25" />
    <text x="34" y="210" class="mono" font-size="11" font-weight="600" fill="#F2F7F4">$ tail -f .agentguard/events.log</text>
    <line x1="20" y1="220" x2="548" y2="220" stroke="#16201B" />

    <g class="step2">
      <rect x="32" y="230" width="94" height="18" rx="4" fill="#450A0A" />
      <text x="38" y="243" class="mono" font-size="9.5" font-weight="700" fill="#FCA5A5">PROTECTED-FILE</text>
      <text x="136" y="243" class="mono" font-size="11" fill="#E4ECE7">.env.local touched (auto-reverted)</text>
      <rect x="484" y="229" width="52" height="20" rx="4" fill="#0D120F" stroke="#2E4237" />
      <text x="493" y="243" class="mono" font-size="10" fill="#B4C3BA">revert</text>
    </g>

    <g class="step3">
      <rect x="32" y="260" width="94" height="18" rx="4" fill="#450A0A" />
      <text x="38" y="273" class="mono" font-size="9.5" font-weight="700" fill="#FCA5A5">LOOP-DETECTED</text>
      <text x="136" y="273" class="mono" font-size="11" fill="#E4ECE7">src/auth/session.ts (6/5 edits/min)</text>
      <rect x="484" y="259" width="52" height="20" rx="4" fill="#0D120F" stroke="#2E4237" />
      <text x="493" y="273" class="mono" font-size="10" fill="#B4C3BA">revert</text>
    </g>

    <g class="step4">
      <rect x="32" y="290" width="94" height="18" rx="4" fill="#451A03" />
      <text x="38" y="303" class="mono" font-size="9.5" font-weight="700" fill="#FCD34D">ZOMBIE-ALERT</text>
      <text x="136" y="303" class="mono" font-size="11" fill="#E4ECE7">PID 48210 (mcp-server-fs) silent 46s</text>
    </g>

    <!-- MCP Process Monitor Box -->
    <rect x="20" y="364" width="528" height="108" rx="8" fill="#0B0F0D" stroke="#1F2C25" />
    <text x="34" y="386" class="mono" font-size="11" font-weight="600" fill="#F2F7F4">$ watch -n 2 ps aux | grep mcp</text>
    <line x1="20" y1="396" x2="548" y2="396" stroke="#16201B" />

    <g class="step4">
      <rect x="30" y="406" width="508" height="54" rx="6" fill="#2A0A0E" stroke="#EF4444" stroke-opacity="0.4" />
      <text x="44" y="426" class="mono" font-size="11.5" font-weight="700" fill="#F2F7F4">PID 48210</text>
      <rect x="116" y="414" width="52" height="16" rx="3" fill="#7F1D1D" />
      <text x="123" y="425" class="mono" font-size="9.5" font-weight="700" fill="#FCA5A5">FROZEN</text>
      <text x="178" y="426" class="mono" font-size="11" fill="#C9D6CE">npx @modelcontextprotocol/server-fs</text>
      <text x="44" y="446" class="mono" font-size="10.5" fill="#8FA197">CPU: 0.0% · Mem: 4.8% · Silence: <tspan fill="#F87171" font-weight="700">46s</tspan></text>
      <rect x="456" y="418" width="68" height="28" rx="5" fill="#DC2626" />
      <text x="466" y="436" class="mono" font-size="10.5" font-weight="700" fill="#FFFFFF">Kill PID</text>
    </g>
  </g>
</svg>
