<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%" role="img" aria-label="agent-leash — The AI Agent and MCP Watchdog for local repositories">
  <defs>
    <radialGradient id="glow" cx="20%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#5BE49B" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#080B09" stop-opacity="0" />
    </radialGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cursor { animation: blink 1.1s infinite; }
    </style>
  </defs>

  <!-- Outer Canvas -->
  <rect width="1200" height="340" rx="16" fill="#080B09" />
  <rect width="1200" height="340" rx="16" fill="url(#glow)" />
  <rect x="1" y="1" width="1198" height="338" rx="15" fill="none" stroke="#1F2C25" stroke-width="2" />

  <!-- Terminal Window Card -->
  <rect x="32" y="28" width="1136" height="284" rx="12" fill="#0D120F" stroke="#1F2C25" stroke-width="1.5" />
  <rect x="32" y="28" width="1136" height="40" rx="12" fill="#0B0F0D" />
  <line x1="32" y1="68" x2="1168" y2="68" stroke="#1F2C25" stroke-width="1.5" />

  <!-- Window Dots -->
  <circle cx="56" cy="48" r="5.5" fill="#2A3A31" />
  <circle cx="74" cy="48" r="5.5" fill="#2A3A31" />
  <circle cx="92" cy="48" r="5.5" fill="#2A3A31" />
  <text x="114" y="52" class="mono" font-size="13" fill="#8FA197">~/repo — npx agent-leash</text>

  <!-- Live Status Chip -->
  <circle cx="1050" cy="48" r="4.5" fill="#5BE49B" />
  <text x="1064" y="52" class="mono" font-size="12" font-weight="600" fill="#5BE49B">WATCHDOG ACTIVE</text>

  <!-- Prompt Line -->
  <text x="64" y="112" class="mono" font-size="15" fill="#5BE49B">$</text>
  <text x="82" y="112" class="mono" font-size="15" fill="#8FA197">npx agent-leash watch --mode balanced</text>

  <!-- Main Headline -->
  <text x="64" y="176" class="mono" font-size="56" font-weight="700" fill="#F2F7F4" letter-spacing="-1.5">
    agent-leash<tspan fill="#5BE49B" class="cursor">_</tspan>
  </text>

  <!-- Subtitle -->
  <text x="64" y="216" class="sans" font-size="20" fill="#C9D6CE">
    The runtime circuit breaker for autonomous AI coding agents &amp; local MCP servers.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(64, 244)">
    <rect x="0" y="0" width="250" height="36" rx="8" fill="#0B0F0D" stroke="#2E4237" />
    <circle cx="18" cy="18" r="4" fill="#5BE49B" />
    <text x="32" y="23" class="mono" font-size="13" fill="#E4ECE7">60s Loop Circuit Breaker</text>

    <rect x="266" y="0" width="246" height="36" rx="8" fill="#0B0F0D" stroke="#2E4237" />
    <circle cx="284" cy="18" r="4" fill="#5BE49B" />
    <text x="298" y="23" class="mono" font-size="13" fill="#E4ECE7">.env &amp; Git Auto-Rollback</text>

    <rect x="528" y="0" width="256" height="36" rx="8" fill="#0B0F0D" stroke="#2E4237" />
    <circle cx="546" cy="18" r="4" fill="#5BE49B" />
    <text x="560" y="23" class="mono" font-size="13" fill="#E4ECE7">Zombie MCP Heartbeat</text>

    <rect x="800" y="0" width="244" height="36" rx="8" fill="#3B0A0A" stroke="#EF4444" stroke-opacity="0.6" />
    <circle cx="818" cy="18" r="4" fill="#EF4444" />
    <text x="832" y="23" class="mono" font-size="13" font-weight="600" fill="#FCA5A5">1-Click Panic Rollback</text>
  </g>
</svg>
